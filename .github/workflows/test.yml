name: Simple Workflow

on:
  workflow_call:  # This makes the workflow reusable  
  workflow_dispatch:  # This allows triggering

jobs:
  hello:
    environment: Dev
    runs-on: ubuntu-latest
    steps:
      - name: Print Hello
        run: |
          echo "🚀 Hello from the target workflow!"
      
      - name: Fail using github-script
        uses: actions/github-script@v7
        with:
          script: |
            const core = require('@actions/core');
            core.setFailed('Failing workflow simply.');
