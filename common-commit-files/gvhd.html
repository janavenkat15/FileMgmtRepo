<!DOCTYPE html>
<html lang="en">

<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>
        GVHD URL Reference
    </title>
    <style>
        .collapsible:after {
            content: '\02795';
            /* Unicode character for "plus" sign (+) */
            font-size: 13px;
            color: white;
            float: right;
            margin-left: 5px;
        }

        .active:after {
            content: "\2796";
            /* Unicode character for "minus" sign (-) */
        }

        .collapsible {
            background-color: #777;
            color: white;
            cursor: pointer;
            padding: 18px;
            width: 80%;
            max-width: 300px;
            border: none;
            text-align: left;
            outline: none;
            font-size: 15px;
        }

        .active,
        .collapsible:hover {
            background-color: #555;
        }

        .content {
            padding: 0 30px;
            display: none;
            max-width: 300px;
            overflow: hidden;
        }
    </style>


</head>

<body style="line-height:2">
    <h2>List of links per environment</h2>
    <ul>
        <li class=collapsible>
            DEV
        </li>
        <ol class=content>
            <li>
                <a href="itms-services://?action=download-manifest&url=https://d14db47lkw54dr.cloudfront.net/iOS/dev/GVHD.plist"
                    target="blank">iOS</a>
            </li>
            <li>
                <a href="https://d14db47lkw54dr.cloudfront.net/android/dev/autoredirectandroid.html" target="blank">
                    Android build</a>
            </li>
            <li>
                <a href="https://dev.gvhd-nonprod.sana-rx.com/api/apidocs/" target="blank"> API</a>

            </li>
            <li>
                <a href="https://dev.gvhd-nonprod.sana-rx.com/" target="blank"> US-EN-Web (us-east-1) </a>

            </li>
        </ol>
    </ul>
    <script>
        var coll = document.getElementsByClassName("collapsible");
        var i;

        for (i = 0; i < coll.length; i++) {
            coll[i].addEventListener("click", function () {
                this.classList.toggle("active");
                var content = this.nextElementSibling;
                if (content.style.display === "block") {
                    content.style.display = "none";
                } else {
                    content.style.display = "block";
                }
            });
        }
    </script>
</body>

</html>
