on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "00 4 * * 2,4"

permissions:
  id-token: write
  contents: read

jobs: 

  Random-Calculation:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    env:
      PRNUM: $${{ github.event.number }}

    outputs:
      RandomNum: $${{ steps.random-num.outputs.Random_Num}}
      PRTitle: $${{ steps.random-num.outputs.PRTitle}}

    steps:

      - name: Get Random Num & PRTitle
        id: random-num
        run: |
          Envcnt = $((length(env_level_replace_val)))
          RNum = $((PRNUM%$Envcnt))
          echo "RNum=$RNum"
          Random_Num=$((PRNUM%ENVCOUNT))
          echo "Random_Num=$Random_Num"
          echo "Random_Num=$Random_Num" >> $GITHUB_OUTPUT
          echo "PRTitle=$${{ github.event.pull_request.title }}"
          echo "PRTitle=$PRTitle" >> $GITHUB_OUTPUT
          
#%{ for idx ,env in env_level_replace_val ~}

  PlanFor${env.environment}:
    needs: Random-Calculation
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'master') || github.event_name == 'pull_request' &&  ( needs.Random-Calculation.outputs.RandomNum == ${idx} || contains(needs.Random-Calculation.outputs.PRTitle, '${env.environment}'))
    uses: ./.github/workflows/Infra-plan.yml
    secrets: inherit
    with:
      account-id: "${env.account-id}"
      aws-region: "${env.aws-region}"
      working-directory: "${common_replace_val.working-directory}"
      var-file: "${env.var-file}"
      backend-file: "${env.backend-file}"
      environment: "${env.environment}"
      vpn-enabled: "${env.vpn-enabled}"

#%{ endfor ~}
