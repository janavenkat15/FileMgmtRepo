name: Cross-Repository API Trigger

on:
  workflow_dispatch:
    inputs:
      infratype:
        type: choice
        required: true
        default: "All_Products_Account"
        description: Select the Infra type to trigger
        options:
          - All_Products_Account
          - All_Products_Application

jobs:
  trigger-workflows:
    runs-on: ubuntu-latest
    steps:
#%{ for env in env_level_replace_val ~}
      - name: ${env.infrarepo}Account
        if: github.event_name == 'workflow_dispatch' && (inputs.infratype == 'All_Products_Account')
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token $${{ secrets.REPO_ACCESS_TOKEN }}" \
            https://api.github.com/repos/janavenkat15/FileMgmtRepo/actions/workflows/test.yml/dispatches
#%{ endfor ~}